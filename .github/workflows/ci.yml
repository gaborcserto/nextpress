name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.2.2

      - name: Audit production dependencies
        run: npm audit --omit=dev

  changes:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    outputs:
      should_validate: ${{ steps.filter.outputs.should_validate }}
      turbo_filters: ${{ steps.filter.outputs.turbo_filters }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for selection
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version-file: .nvmrc

      - name: Select affected workspaces
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-changed.mjs --ci

  validate:
    name: Validate
    needs: changes
    if: needs.changes.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cms?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run format:check:changed -- --ci

      - name: Test changed-file selection
        run: npm run check:changed:test

      - name: Validate agent resources
        run: npm run agents:validate && npm run agents:test

      - name: Lint root tooling
        run: npm run lint:root

      - name: Validate schema and deploy migrations to isolated service
        run: npm run prisma:validate && npm run prisma:deploy

      - name: Validate isolated backend transactions
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextpress_phase1_verify_ci
          NEXTPRESS_CONTENT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextpress_phase1_verify_ci
        run: |
          createdb --host localhost --username postgres nextpress_phase1_verify_ci
          npm --workspace @nextpress/db run prisma:deploy
          npm run prisma:generate
          npm --workspace api test -- src/lib/repos/content-transaction.integration.test.ts

      - name: Validate isolated authentication lifecycle
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextpress_security_verify_ci
          NEXTPRESS_SECURITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextpress_security_verify_ci
          ADMIN_EMAIL: ci-admin@example.invalid
          ADMIN_PASSWORD: disposable-ci-bootstrap-passphrase
        run: |
          createdb --host localhost --username postgres nextpress_security_verify_ci
          npm --workspace @nextpress/db run prisma:deploy
          npm run admin:bootstrap
          npm --workspace api test -- src/lib/auth/live-postgres.integration.test.ts

      - name: Validate affected workspaces
        env:
          TURBO_FILTERS: ${{ needs.changes.outputs.turbo_filters }}
        run: |
          read -r -a filters <<< "$TURBO_FILTERS"
          npx turbo run lint typecheck test:coverage build "${filters[@]}"

  quality-gates:
    name: Quality Gates
    if: always()
    needs:
      - changes
      - validate
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VALIDATE_REQUIRED: ${{ needs.changes.outputs.should_validate }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          [[ "$CHANGES_RESULT" == "success" ]] || exit 1
          [[ "$AUDIT_RESULT" == "success" ]] || exit 1
          if [[ "$VALIDATE_REQUIRED" == "true" ]]; then
            [[ "$VALIDATE_RESULT" == "success" ]] || exit 1
          else
            [[ "$VALIDATE_RESULT" == "skipped" ]] || exit 1
          fi
