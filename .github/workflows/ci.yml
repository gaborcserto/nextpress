name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev

  changes:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    outputs:
      should_validate: ${{ steps.filter.outputs.should_validate }}
      turbo_filters: ${{ steps.filter.outputs.turbo_filters }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for selection
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 22

      - name: Select affected workspaces
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-changed.mjs --ci

  validate:
    name: Validate
    needs: changes
    if: needs.changes.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cms?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@10.2.4

      - name: Install dependencies
        run: npm ci

      - name: Test changed-file selection
        run: npm run check:changed:test

      - name: Validate affected workspaces
        env:
          TURBO_FILTERS: ${{ needs.changes.outputs.turbo_filters }}
        run: |
          read -r -a filters <<< "$TURBO_FILTERS"
          npx turbo run lint typecheck test:coverage build "${filters[@]}"

  quality-gates:
    name: Quality Gates
    if: always()
    needs:
      - changes
      - validate
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VALIDATE_REQUIRED: ${{ needs.changes.outputs.should_validate }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          [[ "$CHANGES_RESULT" == "success" ]] || exit 1
          [[ "$AUDIT_RESULT" == "success" ]] || exit 1
          if [[ "$VALIDATE_REQUIRED" == "true" ]]; then
            [[ "$VALIDATE_RESULT" == "success" ]] || exit 1
          else
            [[ "$VALIDATE_RESULT" == "skipped" ]] || exit 1
          fi
