name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.2.2

      - name: Audit production dependencies
        run: npm audit --omit=dev

  changes:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.filter.outputs.scope }}
      should_validate: ${{ steps.filter.outputs.should_validate }}
      should_validate_agents: ${{ steps.filter.outputs.should_validate_agents }}
      should_build: ${{ steps.filter.outputs.should_build }}
      should_integrate: ${{ steps.filter.outputs.should_integrate }}
      turbo_filters: ${{ steps.filter.outputs.turbo_filters }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for selection
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Select affected workspaces
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-changed.mjs --ci

  validate-agent-resources:
    name: Validate agent resources
    needs: changes
    if: needs.changes.outputs.should_validate_agents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate agent resources
        run: npm run agents:validate && npm run agents:test

  validate:
    name: Validate
    needs: changes
    if: needs.changes.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma configuration requires a URL even for offline validation/generation.
      # The guarded rehearsal runner overrides this with its own disposable target.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/cms?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The selector regression suite also compares HEAD to its parent.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Check repository formatting
        run: npm run format:check

      - name: Test changed-file selection
        run: npm run check:changed:test

      - name: Lint root tooling
        run: npm run lint:root

      - name: Validate Prisma schema
        if: needs.changes.outputs.should_integrate == 'true'
        run: npm run prisma:validate

      # This cache holds only workspace lint logs. No executable build output,
      # coverage, Prisma client or integration state passes through it.
      - name: Restore Turbo lint cache
        id: lint-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .turbo/ci-lint
          key: turbo-ci-lint-v1-${{ runner.os }}-${{ runner.arch }}-npm12.2.2-${{ hashFiles('.nvmrc', 'package-lock.json', 'turbo.json', '**/turbo.json', '.github/workflows/ci.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-ci-lint-v1-${{ runner.os }}-${{ runner.arch }}-npm12.2.2-${{ hashFiles('.nvmrc', 'package-lock.json', 'turbo.json', '**/turbo.json', '.github/workflows/ci.yml') }}-

      - name: Lint affected workspaces
        env:
          TURBO_FILTERS: ${{ needs.changes.outputs.turbo_filters }}
        run: |
          filters=()
          if [[ "$TURBO_FILTERS" != "full" ]]; then
            read -r -a filters <<< "$TURBO_FILTERS"
          fi
          npx turbo run lint --cache-dir=.turbo/ci-lint --cache=local:rw "${filters[@]}"

      - name: Save trusted Turbo lint cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .turbo/ci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

      - name: Validate affected workspaces
        env:
          TURBO_FILTERS: ${{ needs.changes.outputs.turbo_filters }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.should_build }}
        run: |
          filters=()
          if [[ "$TURBO_FILTERS" != "full" ]]; then
            read -r -a filters <<< "$TURBO_FILTERS"
          fi
          tasks=(typecheck test:coverage)
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            tasks+=(build)
          fi
          npx turbo run "${tasks[@]}" --cache=local:rw "${filters[@]}"

      - name: Prepare generated client for guarded rehearsals
        if: needs.changes.outputs.should_integrate == 'true'
        run: |
          if [[ ! -f packages/db/generated/prisma/client.ts ]]; then
            npm run prisma:generate
          fi

      # The content rehearsal includes authenticated browser preview assertions.
      - name: Install Playwright Chromium for authenticated integration tests
        if: needs.changes.outputs.should_integrate == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate isolated backend transactions
        if: needs.changes.outputs.should_integrate == 'true'
        working-directory: apps/api
        run: npx tsx scripts/b04-postgres.ts content

      - name: Validate isolated authentication lifecycle
        if: needs.changes.outputs.should_integrate == 'true'
        working-directory: apps/api
        run: npx tsx scripts/b04-postgres.ts security

  quality-gates:
    name: Quality Gates
    if: always()
    needs:
      - changes
      - validate
      - validate-agent-resources
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VALIDATE_REQUIRED: ${{ needs.changes.outputs.should_validate }}
          AGENT_RESULT: ${{ needs.validate-agent-resources.result }}
          AGENT_REQUIRED: ${{ needs.changes.outputs.should_validate_agents }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.should_build }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.should_integrate }}
          TURBO_FILTERS: ${{ needs.changes.outputs.turbo_filters }}
        run: |
          require_job() {
            case "$1:$2" in
              true:success|false:skipped) return 0 ;;
              *) echo "Invalid requirement or result for $3 ($1:$2)"; return 1 ;;
            esac
          }
          [[ "$CHANGES_RESULT" == "success" && "$AUDIT_RESULT" == "success" ]] || exit 1
          require_job "$AGENT_REQUIRED" "$AGENT_RESULT" agents || exit 1
          require_job "$VALIDATE_REQUIRED" "$VALIDATE_RESULT" validation || exit 1

          case "$SCOPE:$VALIDATE_REQUIRED:$BUILD_REQUIRED:$INTEGRATION_REQUIRED:$AGENT_REQUIRED" in
            none:false:false:false:true|none:false:false:false:false|full:true:true:true:true)
              [[ "$TURBO_FILTERS" == "$SCOPE" ]]
              ;;
            affected:true:true:true:true|affected:true:true:false:true|affected:true:false:false:true)
              filter='--filter=\.\.\.\{\./(apps/(admin|api|web)|packages/(db|shared|eslint-config))\}'
              [[ "$TURBO_FILTERS" =~ ^$filter(\ $filter)*$ ]]
              ;;
            *) exit 1 ;;
          esac
