services:
  db:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg:/var/lib/postgresql]
volumes:
  pg:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME to the inspected PostgreSQL parent volume; see docs/postgresql.md}
